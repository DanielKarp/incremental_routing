[project]
name = "incremental-routing"
version = "0.1.0"
description = "Builds the transit timetable for Incremental Routing, a leg-by-leg trip planner"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
ir-build-data = "incremental_routing.gtfs.build_data:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incremental_routing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
