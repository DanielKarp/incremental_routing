# Incremental Routing with Docker Compose. Copy .env.example to .env and set API_511_KEY, then:
#   docker compose up -d --build                    the app, at http://localhost:8000
#   docker compose --profile tunnel up -d --build   the app, shared through a Cloudflare tunnel
name: incremental-routing

services:
  app:
    build: .
    image: incremental-routing
    env_file: .env
    environment:
      # Fixed inside the container, whatever .env says for running without Docker.
      IR_DATA_DIR: /data
      IR_STATIC_DIR: /app/static
    ports:
      # This machine only, unless BIND=0.0.0.0 in .env opens it to your network.
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - transit-data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)
      interval: 1m
      timeout: 10s
      start_period: 30s
      retries: 3

  # Optional: shares the app through a Cloudflare tunnel (README, "Share it with friends").
  # Started only with --profile tunnel, and needs TUNNEL_TOKEN in .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: [tunnel]

volumes:
  # The downloaded 511 feed and the database built from it (about 700 MB).
  transit-data:
